name: zspeed
services:
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru", "--save", "", "--appendonly", "no"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 6
  simulator:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    command: ["node", "dist/simulator/index.js"]
    env_file: docker/.env
    environment:
      SIMULATOR_PORT: "3002"
      SIMULATOR_DB_PATH: /app/backend/data/simulator.db
    volumes:
      - simulator-data:/app/backend/data
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    env_file: docker/.env
    environment:
      PORT: "3001"
      DB_PATH: /app/backend/data/zspeed.db
      READ_MODEL_PATH: /app/backend/data/vehicle-reads.db
      READ_REPLICA_PATH: /app/backend/data/vehicle-replica.db
      REDIS_URL: redis://redis:6379
      MAINTENANCE_TIMEZONE: ${MAINTENANCE_TIMEZONE:-UTC}
      PLATFORM_BASE_URL: http://backend:3001
      VOLTERA_BASE_URL: http://simulator:3002/oem/voltera
      CRESTLINE_BASE_URL: http://simulator:3002/oem/crestline
      NAVARRO_BASE_URL: http://simulator:3002/oem/navarro
    volumes:
      - backend-data:/app/backend/data
    depends_on:
      simulator:
        condition: service_healthy
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    env_file: docker/.env
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
volumes:
  backend-data:
  simulator-data:
  caddy-data:
  caddy-config:
